name: "Test Features"

# Runs on PRs and on demand. Pushes to main are tested by the Release workflow's
# gate, so there is no push trigger here.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Some pinned actions (docker/login-action@v3, devcontainers/action@v1) still
# ship Node 20 entry points. Force Node 24 until they publish Node 24 releases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.set.outputs.features }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine changed features
        id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run → test everything.
            feats=$(ls src)
          else
            base="${{ github.event.pull_request.base.sha }}"
            changed=$(git diff --name-only "$base" "${{ github.sha }}")
            # A change to core or the harness/workflows can affect every feature.
            if echo "$changed" | grep -qE '^(src/core/|test/_|\.github/workflows/)'; then
              feats=$(ls src)
            else
              feats=$(echo "$changed" | grep -oE '^(src|test)/[^/]+/' | cut -d/ -f2 | sort -u)
            fi
          fi
          # Keep only feature dirs that still exist (ignore deletions), as JSON.
          json=$(for f in $feats; do [ -d "src/$f" ] && echo "$f"; done | jq -R . | jq -cs .)
          echo "features=$json" >> "$GITHUB_OUTPUT"
          echo "Testing: $json"

  test:
    needs: detect
    if: needs.detect.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect.outputs.features) }}
    steps:
      - uses: actions/checkout@v5

      # Scenario tests resolve installsAfter (e.g. core) from GHCR. Log in so
      # the dependency pull is authenticated even while packages are private.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test feature '${{ matrix.feature }}'
        # --skip-autogenerated: every non-core feature hard-requires the `core`
        # feature, so the single-feature autogenerated tests can't pass. The
        # per-feature scenarios (test/<f>/scenarios.json) install core + the
        # feature on an appropriate base and reuse test/<f>/test.sh.
        run: devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated --project-folder .

  # Single stable status check (matrix job names vary with the changed set, and a
  # skipped matrix shouldn't read as failure). Make this the required check.
  tests-passed:
    needs: [detect, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test result
        run: |
          detect="${{ needs.detect.result }}"
          result="${{ needs.test.result }}"
          if [ "$detect" != "success" ]; then
            echo "detect job did not succeed (result=$detect)." >&2
            exit 1
          fi
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Feature tests failed (result=$result)." >&2
            exit 1
          fi
          echo "OK (detect=$detect, test=$result)."
